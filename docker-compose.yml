version: "3.8"
services:
  dashy:
    image: lissy93/dashy:4.9.18
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "11001:8080"
    volumes:
      - ./data:/app/user-data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null && curl -fsS http://127.0.0.1:8080/) || (command -v wget >/dev/null && wget -q -O /dev/null http://127.0.0.1:8080/) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
x-app-meta:
  web:
    port: 11001
    protocol: http
